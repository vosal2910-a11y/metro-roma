# Netlify Configuration for Roma Transit Express
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback for React Router / Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
